<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Chatbot WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .bg-wpp {
            background-color: #efeae2;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d3cec8' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen" x-data x-cloak>

    <!-- ═══════════════════════════════════════════════════════════════
         LOGIN VIEW (sin token)
         ═══════════════════════════════════════════════════════════════ -->
    <template x-if="!$store.auth.token">
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-600 to-green-800">
            <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                <div class="text-center mb-8">
                    <div class="text-5xl mb-4">💬</div>
                    <h1 class="text-2xl font-bold text-gray-800">Panel Admin</h1>
                    <p class="text-gray-500 text-sm mt-1">Chatbot WhatsApp</p>
                </div>

                <form @submit.prevent="doLogin" x-data="loginForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                        <input type="text" x-model="username" placeholder="Ingresá tu usuario"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input type="password" x-model="password" placeholder="••••••••"
                               class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none">
                    </div>

                    <button type="submit"
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg transition-colors disabled:opacity-50"
                            x-text="loading ? 'Ingresando...' : 'Ingresar'"
                            :disabled="loading">
                    </button>

                    <p x-show="error" x-text="error" class="text-red-600 text-sm text-center mt-3 font-medium"></p>
                </form>
            </div>
        </div>
    </template>

    <!-- ═══════════════════════════════════════════════════════════════
         APP VIEW (autenticado)
         ═══════════════════════════════════════════════════════════════ -->
    <template x-if="$store.auth.token">
        <div x-data="{ activeTab: 'config', switchTab(tab) { if (Alpine.store('csvEditor')?.dirty && !confirm('Tenés cambios sin guardar en el CSV. ¿Descartarlos?')) return; this.activeTab = tab; if (tab === 'config') loadContactConfig(); if (tab === 'docs') { loadPdfs(); loadCsvs(); } if (tab === 'logs') loadLogs(); } }" x-init="loadContactConfig()">

            <!-- NAVBAR -->
            <nav class="bg-green-700 text-white shadow-lg">
                <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">💬</span>
                        <span class="font-bold text-lg">Panel Admin</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <button @click="$store.app.botPhone && window.open('https://wa.me/' + $store.app.botPhone, '_blank')"
                                :class="$store.app.botPhone ? 'bg-green-600 hover:bg-green-500 cursor-pointer' : 'bg-green-800 opacity-50 cursor-not-allowed'"
                                :disabled="!$store.app.botPhone"
                                :title="$store.app.botPhone ? 'Abrir WhatsApp' : 'Configurá el número del bot'"
                                class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5">
                            <span>📱</span>
                            <span x-text="$store.app.botPhone ? 'WhatsApp' : 'Sin configurar'"></span>
                        </button>
                        <button @click="$store.auth.logout()"
                                class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm transition-colors">
                            Cerrar sesión
                        </button>
                    </div>
                </div>
            </nav>

            <!-- TAB BAR -->
            <div class="max-w-5xl mx-auto py-6 px-4">
                <div class="flex space-x-1 border-b border-gray-300 mb-6">
                    <button @click="switchTab('config')"
                            :class="activeTab === 'config' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'"
                            class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors">
                        🔑 Configuración
                    </button>
                    <button @click="switchTab('docs')"
                            :class="activeTab === 'docs' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'"
                            class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors">
                        📁 Documentos
                    </button>
                    <button @click="switchTab('logs')"
                            :class="activeTab === 'logs' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'"
                            class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors">
                        📜 Logs
                    </button>
                </div>

                <!-- ─── TAB: Configuración ─── -->
                <div x-show="activeTab === 'config'" class="bg-white p-6 rounded-lg shadow-md">
                    <h2 class="text-xl font-semibold mb-4">Configuración de Google API Key</h2>
                    <div class="flex gap-4">
                        <input type="text" id="api-key-input" placeholder="Pega tu clave aquí..."
                               class="flex-1 border border-gray-300 rounded px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <button id="save-api-key-btn" onclick="saveApiKey()"
                                class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-6 rounded transition-colors">
                            Guardar en .env
                        </button>
                    </div>
                    <p id="api-status" class="mt-3 font-medium text-sm h-5"></p>

                    <hr class="my-8 border-gray-200">

                    <h2 class="text-xl font-semibold mb-4 text-gray-800">☎️ Variables de Contacto (Bot)</h2>
                    <p class="text-sm text-gray-500 mb-4">Estos datos se inyectarán dinámicamente en las respuestas de la IA.</p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Correo de Soporte</label>
                            <input type="email" id="config-email" placeholder="soporte@tuempresa.com"
                                   class="w-full border border-gray-300 rounded px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Teléfono de Contacto</label>
                            <div class="flex shadow-sm rounded">
                                <select id="config-country-code"
                                        class="border border-gray-300 rounded-l px-2 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 border-r-0 cursor-pointer max-w-[180px]">
                                    <option value="+54">(ARG) +54</option>
                                    <option value="+56">(CHL) +56</option>
                                    <option value="+57">(COL) +57</option>
                                    <option value="+52">(MEX) +52</option>
                                    <option value="+51">(PER) +51</option>
                                    <option value="+598">(URY) +598</option>
                                    <option value="+58">(VEN) +58</option>
                                    <option value="+591">(BOL) +591</option>
                                    <option value="+595">(PRY) +595</option>
                                    <option value="+593">(ECU) +593</option>
                                    <option value="+1">(USA) +1</option>
                                    <option value="+34">(ESP) +34</option>
                                </select>
                                <input type="text" id="config-phone" placeholder="11 1234-5678"
                                       class="flex-1 border border-gray-300 rounded-r px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                    </div>
                    <div class="mt-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">📱 Número de WhatsApp del Bot</label>
                        <input type="text" id="config-bot-phone" placeholder="5491112345678 (sin + ni espacios)"
                               class="w-full border border-gray-300 rounded px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                        <p class="text-xs text-gray-400 mt-1">Se usa para el link directo a WhatsApp en el navbar.</p>
                    </div>
                    <div class="flex gap-3 mt-2">
                        <button id="save-config-btn" onclick="saveContactConfig()"
                                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition-colors">
                            Guardar Datos
                        </button>
                    </div>
                    <p id="config-status" class="mt-3 font-medium text-sm h-5"></p>
                </div>

                <!-- ─── TAB: Documentos ─── -->
                <div x-show="activeTab === 'docs'" class="bg-white p-6 rounded-lg shadow-md">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                        <div>
                            <h2 class="text-xl font-semibold mb-4">📤 Subir Nuevos</h2>
                            <input type="file" id="pdf-upload" multiple accept=".pdf"
                                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4 cursor-pointer border border-gray-200 rounded p-2">
                            <button id="upload-pdf-btn" onclick="uploadPdfs()"
                                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition-colors">
                                🚀 Cargar al servidor
                            </button>
                            <p id="upload-status" class="mt-3 font-medium text-sm h-5"></p>
                        </div>
                        <div>
                            <h2 class="text-xl font-semibold mb-4 flex justify-between items-center">
                                <span>📥 Archivos en Servidor</span>
                                <button onclick="loadPdfs()"
                                        class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded">
                                    🔄 Refrescar
                                </button>
                            </h2>
                            <ul id="pdf-list" class="border border-gray-200 rounded divide-y divide-gray-200 bg-gray-50">
                                <li class="p-3 text-gray-500 italic">Cargando...</li>
                            </ul>
                        </div>
                    </div>

                    <!-- ─── CSV Section ─── -->
                    <hr class="my-8 border-gray-300">

                    <h2 class="text-xl font-semibold mb-4">📊 Gestión de CSVs</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                        <div>
                            <h3 class="text-lg font-semibold mb-3">📤 Subir CSV</h3>
                            <input type="file" id="csv-upload" accept=".csv"
                                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 mb-4 cursor-pointer border border-gray-200 rounded p-2">
                            <button id="upload-csv-btn" onclick="uploadCsvs()"
                                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded transition-colors">
                                🚀 Subir CSV
                            </button>
                            <p id="csv-upload-status" class="mt-3 font-medium text-sm h-5"></p>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold mb-3 flex justify-between items-center">
                                <span>📥 Archivos CSV</span>
                                <button onclick="loadCsvs()"
                                        class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded">
                                    🔄 Refrescar
                                </button>
                            </h3>
                            <ul id="csv-list" class="border border-gray-200 rounded divide-y divide-gray-200 bg-gray-50">
                                <li class="p-3 text-gray-500 italic">Cargando...</li>
                            </ul>
                        </div>
                    </div>

                    <!-- CSV Editor -->
                    <div x-data x-show="$store.csvEditor.show" class="mt-8 border border-gray-200 rounded-lg p-4 bg-gray-50">
                        <h3 class="text-lg font-semibold mb-3" x-text="`✏️ Editando: ${$store.csvEditor.filename}`"></h3>

                        <div x-show="$store.csvEditor.loading" class="text-center py-8 text-gray-500">Cargando datos...</div>

                        <div x-show="!$store.csvEditor.loading">
                            <div class="overflow-x-auto mb-4">
                                <table class="w-full border-collapse border border-gray-300">
                                    <thead>
                                        <tr>
                                            <th class="border border-gray-300 bg-gray-200 px-2 py-2 text-center text-sm font-semibold w-10">#</th>
                                            <template x-for="(header, idx) in $store.csvEditor.headers" :key="idx">
                                                <th class="border border-gray-300 bg-gray-200 px-3 py-2 text-left text-sm font-semibold" x-text="header"></th>
                                            </template>
                                            <th class="border border-gray-300 bg-gray-200 px-2 py-2 text-center text-sm font-semibold w-12">🗑️</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template x-for="(row, rowIdx) in $store.csvEditor.rows" :key="rowIdx">
                                            <tr>
                                                <td class="border border-gray-300 px-2 py-2 text-center text-xs text-gray-500" x-text="rowIdx + 1"></td>
                                                <template x-for="(cell, colIdx) in row" :key="colIdx">
                                                    <td class="border border-gray-300 p-1">
                                                        <input type="text" x-model="$store.csvEditor.rows[rowIdx][colIdx]"
                                                               @input="$store.csvEditor.markDirty()"
                                                               class="w-full border-0 bg-transparent px-2 py-1 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white rounded outline-none">
                                                    </td>
                                                </template>
                                                <td class="border border-gray-300 px-1 py-1 text-center">
                                                    <button @click="$store.csvEditor.removeRow(rowIdx)"
                                                            class="text-red-500 hover:text-red-700 hover:bg-red-100 p-1 rounded text-lg leading-none"
                                                            title="Eliminar fila">✖</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            <div class="flex gap-3 flex-wrap">
                                <button @click="$store.csvEditor.save()" :disabled="$store.csvEditor.saving"
                                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition-colors disabled:opacity-50"
                                        x-text="$store.csvEditor.saving ? 'Guardando...' : '💾 Guardar cambios'">
                                </button>
                                <button @click="$store.csvEditor.addRow()"
                                        class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition-colors">
                                    ➕ Agregar fila
                                </button>

                                <button @click="$store.csvEditor.cancel()"
                                        class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded transition-colors">
                                    ❌ Cancelar
                                </button>
                                <span x-show="$store.csvEditor.status" x-text="$store.csvEditor.status"
                                      class="ml-3 self-center text-sm font-medium"
                                      :class="$store.csvEditor.statusClass"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ─── TAB: Logs ─── -->
                <div x-show="activeTab === 'logs'" class="bg-white p-6 rounded-lg shadow-md">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-1 border-r pr-4">
                            <h2 class="text-lg font-semibold mb-4 flex justify-between items-center">
                                <span>📋 Registros</span>
                                <button onclick="loadLogs()"
                                        class="text-xs bg-gray-200 hover:bg-gray-300 py-1 px-2 rounded">🔄</button>
                            </h2>
                            <ul id="log-list" class="space-y-2 max-h-96 overflow-y-auto">
                                <li class="text-gray-500 italic">Cargando...</li>
                            </ul>
                        </div>
                        <div class="md:col-span-2">
                            <h2 id="log-title" class="text-lg font-semibold mb-4 text-gray-700">Selecciona un archivo para leer</h2>

                            <!-- Phone filter — hidden until a log file is selected -->
                            <div id="log-filter" class="hidden mb-4 p-3 bg-gray-50 rounded border border-gray-200">
                                <label class="text-sm font-medium text-gray-700 mr-2">Filtrar por teléfono:</label>
                                <select id="phone-filter" class="border border-gray-300 rounded px-3 py-1.5 text-sm"
                                        onchange="applyPhoneFilter()">
                                    <option value="">Todos los mensajes</option>
                                </select>
                            </div>

                            <div id="log-viewer"
                                 class="w-full h-[500px] bg-wpp p-4 rounded overflow-y-auto flex flex-col gap-3 shadow-inner border border-gray-300">
                                <div class="text-center text-gray-500 text-sm mt-4">Selecciona un log a la izquierda para visualizar la conversación.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ═══════════════════════════════════════════════════════════════
         ALPINE.JS STORE
         ═══════════════════════════════════════════════════════════════ -->
    <!-- ═══════════════════════════════════════════════════════════════
         API HELPER — agrega Bearer token a todas las llamadas
         ═══════════════════════════════════════════════════════════════ -->
    <script>
        function apiFetch(url, options = {}) {
            const token = localStorage.getItem('token');
            const headers = options.headers || {};
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            return fetch(url, { ...options, headers });
        }
    </script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('auth', {
                token: localStorage.getItem('token'),

                async verify() {
                    try {
                        const res = await apiFetch('/api/auth/verify', {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        const data = await res.json();
                        if (!data.valid) {
                            this.token = null;
                            localStorage.removeItem('token');
                        }
                    } catch {
                        this.token = null;
                        localStorage.removeItem('token');
                    }
                },

                init() {
                    // Alpine stores don't auto-call init — we call verify below
                },

                async login(username, password) {
                    const fd = new FormData();
                    fd.append('username', username);
                    fd.append('password', password);
                    const res = await apiFetch('/api/auth/login', { method: 'POST', body: fd });
                    if (!res.ok) {
                        const err = await res.json();
                        throw new Error(err.detail || 'Credenciales inválidas');
                    }
                    const data = await res.json();
                    this.token = data.token;
                    localStorage.setItem('token', data.token);
                },

                logout() {
                    this.token = null;
                    localStorage.removeItem('token');
                }
            });

            Alpine.store('app', {
                botPhone: '',
            });

            Alpine.store('csvEditor', {
                show: false,
                filename: '',
                headers: [],
                rows: [],
                loading: false,
                saving: false,
                status: '',
                statusClass: '',
                dirty: false,

                markDirty() {
                    this.dirty = true;
                },

                async edit(filename) {
                    if (this.show && this.dirty) {
                        if (!confirm('Tenés cambios sin guardar. ¿Seguro que querés descartarlos?')) return;
                    }
                    this.dirty = false;
                    this.show = true;
                    this.filename = filename;
                    this.loading = true;
                    this.status = '';
                    try {
                        const res = await apiFetch(`/api/csvs/${filename}/data`);
                        const data = await res.json();
                        this.headers = data.headers;
                        this.rows = data.rows;
                    } catch (err) {
                        this.status = '❌ Error al cargar datos';
                        this.statusClass = 'text-red-600';
                    } finally {
                        this.loading = false;
                    }
                },

                async save() {
                    this.saving = true;
                    this.status = '⏳ Guardando...';
                    this.statusClass = 'text-blue-500';
                    try {
                        const res = await apiFetch(`/api/csvs/${this.filename}/data`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                headers: this.headers,
                                rows: this.rows
                            })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            this.status = '✅ Cambios guardados';
                            this.statusClass = 'text-green-600';
                            this.dirty = false;
                        } else {
                            this.status = `❌ ${data.detail || 'Error al guardar'}`;
                            this.statusClass = 'text-red-600';
                        }
                    } catch (err) {
                        this.status = '❌ Error de conexión';
                        this.statusClass = 'text-red-600';
                    } finally {
                        this.saving = false;
                        setTimeout(() => this.status = '', 3000);
                    }
                },

                addRow() {
                    const empty = new Array(this.headers.length).fill('');
                    this.rows.push(empty);
                    this.markDirty();
                },

                removeRow(index) {
                    if (this.dirty && !confirm('¿Eliminar esta fila?')) return;
                    this.rows.splice(index, 1);
                    this.markDirty();
                },

                cancel() {
                    if (this.dirty && !confirm('Descartar cambios?')) return;
                    this.show = false;
                    this.filename = '';
                    this.headers = [];
                    this.rows = [];
                    this.dirty = false;
                    this.status = '';
                }
            });

            // Verify token on page load
            Alpine.store('auth').verify();
        });
    </script>

    <!-- ═══════════════════════════════════════════════════════════════
         LOGIN FORM LOGIC (Alpine data)
         ═══════════════════════════════════════════════════════════════ -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('loginForm', () => ({
                username: '',
                password: '',
                loading: false,
                error: '',
                async doLogin() {
                    this.loading = true;
                    this.error = '';
                    try {
                        await Alpine.store('auth').login(this.username, this.password);
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                }
            }));
        });
    </script>

    <!-- ═══════════════════════════════════════════════════════════════
          TOAST CONTAINER
          ═══════════════════════════════════════════════════════════════ -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const colors = {
                success: 'bg-green-600 text-white',
                error: 'bg-red-600 text-white',
                info: 'bg-blue-600 text-white'
            };
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            const toast = document.createElement('div');
            toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-all duration-300 flex items-center gap-2`;
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>

        async function loadContactConfig() {
            try {
                const res = await apiFetch('/api/config');
                const data = await res.json();

                document.getElementById('config-email').value = data.email || '';

                const telCompleto = data.telefono || '';
                const selectCodigo = document.getElementById('config-country-code');
                let numeroSinCodigo = telCompleto;

                const options = Array.from(selectCodigo.options).sort((a, b) => b.value.length - a.value.length);

                for (let opt of options) {
                    if (telCompleto.startsWith(opt.value)) {
                        selectCodigo.value = opt.value;
                        numeroSinCodigo = telCompleto.substring(opt.value.length).trim();
                        break;
                    }
                }
                document.getElementById('config-phone').value = numeroSinCodigo;

                const botPhone = data.bot_phone || '';
                document.getElementById('config-bot-phone').value = botPhone;
                // Sync to Alpine store for navbar reactivity
                Alpine.store('app').botPhone = botPhone;

            } catch (err) {
                console.error("Error al cargar la configuración de contacto", err);
            }
        }

        function applyPhoneFilter() {

        async function renderLog(filename, phone) {
            const viewer = document.getElementById('log-viewer');
            viewer.innerHTML = '<div class="text-center text-gray-500 text-sm mt-4">Cargando conversación...</div>';

            try {
                let url = `/api/logs/${filename}`;
                if (phone) {
                    url += `?phone=${encodeURIComponent(phone)}`;
                }
                const res = await apiFetch(url);
                const data = await res.json();

                const lines = data.contenido.split('\n');
                viewer.innerHTML = "";

                if (lines.length === 0 || (lines.length === 1 && lines[0] === "")) {
                    viewer.innerHTML = '<div class="text-center text-gray-500 text-sm mt-4">El log está vacío.</div>';
                    return;
                }

                lines.forEach(line => {
                    const txt = line.trim();
                    if (!txt) return;

                    const parts = txt.split('|||');

                    if (parts.length >= 4) {
                        const internalId = parts[0];
                        const displayName = parts[1];
                        const time = parts[2];
                        const msg = parts.slice(3).join('|||').split('[BR]').join('\n');

                        const isUser = (internalId === 'id_usuario');

                        const wrapper = document.createElement('div');
                        wrapper.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;

                        const bubble = document.createElement('div');
                        bubble.className = `max-w-[85%] rounded-lg px-3 py-2 shadow-sm relative text-[15px] ${isUser ? 'bg-[#dcf8c6] rounded-tr-none' : 'bg-white rounded-tl-none'}`;

                        const nameDiv = document.createElement('div');
                        nameDiv.className = `text-xs font-bold mb-0.5 ${isUser ? 'text-green-600' : 'text-blue-500'}`;
                        nameDiv.innerText = displayName;

                        const msgDiv = document.createElement('div');
                        msgDiv.className = "text-gray-800 break-words whitespace-pre-wrap leading-tight";
                        msgDiv.innerText = msg;

                        const timeDiv = document.createElement('div');
                        timeDiv.className = "text-[10px] text-gray-500 text-right mt-1";
                        timeDiv.innerText = time;

                        bubble.appendChild(nameDiv);
                        bubble.appendChild(msgDiv);
                        bubble.appendChild(timeDiv);
                        wrapper.appendChild(bubble);
                        viewer.appendChild(wrapper);

                    } else {
                        const cleanSys = txt.replace(/=/g, '').trim();
                        if (cleanSys) {
                            const sysWrapper = document.createElement('div');
                            sysWrapper.className = "flex w-full justify-center my-2";
                            const sysBubble = document.createElement('div');
                            sysBubble.className = "bg-[#d1d5db] text-gray-700 text-xs px-3 py-1 rounded-full opacity-80 text-center max-w-[90%]";
                            sysBubble.innerText = cleanSys;
                            sysWrapper.appendChild(sysBubble);
                            viewer.appendChild(sysWrapper);
                        }
                    }
                });

                viewer.scrollTop = viewer.scrollHeight;

            } catch (err) {
                viewer.innerHTML = '<div class="text-center text-red-500 font-bold mt-4">❌ Error al leer el archivo.</div>';
            }
        }

        async function readLog(filename) {
            currentLogFile = filename;
            document.getElementById('log-title').innerText = `📄 Viendo: ${filename}`;

            // Show filter and load phones
            const filterDiv = document.getElementById('log-filter');
            filterDiv.classList.remove('hidden');
            document.getElementById('phone-filter').value = '';
            await loadPhones(filename);

            await renderLog(filename, '');
        }

        /* ─── Download helper (blob via apiFetch) ──────────────────── */
        async function downloadFile(url, filename) {
            try {
                const res = await apiFetch(url);
                if (!res.ok) throw new Error('Error al descargar');
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            } catch (err) {
                alert('Error al descargar: ' + err.message);
            }
        }
