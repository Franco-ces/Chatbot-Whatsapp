<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo RAG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold text-gray-900 mb-8 flex items-center gap-2">
            🛠️ Panel Administrativo RAG
        </h1>

        <div class="flex space-x-1 border-b border-gray-300 mb-6">
            <button onclick="showTab('tab-api')" id="btn-tab-api" class="px-6 py-3 bg-white text-blue-600 font-semibold rounded-t-lg shadow-sm border-b-2 border-blue-600 focus:outline-none transition-colors">🔑 API</button>
            <button onclick="showTab('tab-pdf')" id="btn-tab-pdf" class="px-6 py-3 bg-gray-200 text-gray-600 hover:bg-gray-300 font-semibold rounded-t-lg focus:outline-none transition-colors">📁 Documentos</button>
            <button onclick="showTab('tab-logs')" id="btn-tab-logs" class="px-6 py-3 bg-gray-200 text-gray-600 hover:bg-gray-300 font-semibold rounded-t-lg focus:outline-none transition-colors">📜 Logs</button>
        </div>

        <div id="tab-api" class="tab-content bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">Configuración de Google API Key</h2>
            <div class="flex gap-4">
                <input type="text" id="api-key-input" placeholder="Pega tu clave aquí..." class="flex-1 border border-gray-300 rounded px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition-colors">Guardar en .env</button>
            </div>
            <p id="api-status" class="mt-3 font-medium text-sm h-5"></p>
        </div>

        <div id="tab-pdf" class="tab-content hidden bg-white p-6 rounded-lg shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                <div>
                    <h2 class="text-xl font-semibold mb-4">📤 Subir Nuevos</h2>
                    <input type="file" id="pdf-upload" multiple accept=".pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4 cursor-pointer border border-gray-200 rounded p-2">
                    <button onclick="uploadPdfs()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition-colors">🚀 Cargar al servidor</button>
                    <p id="upload-status" class="mt-3 font-medium text-sm h-5"></p>
                </div>
                <div>
                    <h2 class="text-xl font-semibold mb-4 flex justify-between items-center">
                        <span>📥 Archivos en Servidor</span>
                        <button onclick="loadPdfs()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 py-1 px-3 rounded">🔄 Refrescar</button>
                    </h2>
                    <ul id="pdf-list" class="border border-gray-200 rounded divide-y divide-gray-200 bg-gray-50">
                        <li class="p-3 text-gray-500 italic">Cargando...</li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="tab-logs" class="tab-content hidden bg-white p-6 rounded-lg shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-1 border-r pr-4">
                    <h2 class="text-lg font-semibold mb-4 flex justify-between items-center">
                        <span>📋 Registros</span>
                        <button onclick="loadLogs()" class="text-xs bg-gray-200 hover:bg-gray-300 py-1 px-2 rounded">🔄</button>
                    </h2>
                    <ul id="log-list" class="space-y-2 max-h-96 overflow-y-auto">
                        <li class="text-gray-500 italic">Cargando...</li>
                    </ul>
                </div>
                <div class="md:col-span-2">
                    <h2 id="log-title" class="text-lg font-semibold mb-4 text-gray-700">Selecciona un archivo para leer</h2>
                    <textarea id="log-viewer" readonly class="w-full h-96 bg-gray-900 text-green-400 p-4 rounded font-mono text-sm outline-none resize-none shadow-inner">...</textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            const activeClasses = ['bg-white', 'text-blue-600', 'border-b-2', 'border-blue-600'];
            const inactiveClasses = ['bg-gray-200', 'text-gray-600', 'hover:bg-gray-300'];
            document.querySelectorAll('button[id^="btn-tab"]').forEach(btn => {
                btn.classList.remove(...activeClasses);
                btn.classList.add(...inactiveClasses);
            });
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.remove(...inactiveClasses);
            activeBtn.classList.add(...activeClasses);
            if(tabId === 'tab-pdf') loadPdfs();
            if(tabId === 'tab-logs') loadLogs();
        }

        async function saveApiKey() {
            const key = document.getElementById('api-key-input').value;
            const statusLabel = document.getElementById('api-status');
            if(!key) { 
                statusLabel.innerText = "⚠️ Escribe una clave"; 
                statusLabel.className = "mt-3 text-orange-500 font-medium h-5"; 
                setTimeout(() => statusLabel.innerText = "", 3000);
                return; 
            }
            const formData = new FormData();
            formData.append("key", key);
            try {
                const res = await fetch('/api/apikey', { method: 'POST', body: formData });
                const data = await res.json();
                statusLabel.innerText = data.message;
                statusLabel.className = data.status === "success" ? "mt-3 text-green-600 font-medium h-5" : "mt-3 text-red-600 font-medium h-5";
                setTimeout(() => statusLabel.innerText = "", 3000);
            } catch (err) {
                statusLabel.innerText = "❌ Error de conexión";
                setTimeout(() => statusLabel.innerText = "", 3000);
            }
        }

        async function loadPdfs() {
            const list = document.getElementById('pdf-list');
            try {
                const res = await fetch('/api/pdfs');
                const data = await res.json();
                list.innerHTML = "";
                if(data.pdfs.length === 0) { list.innerHTML = "<li class='p-3 text-gray-500 italic'>📁 Carpeta vacía</li>"; return; }
                data.pdfs.forEach(pdf => {
                    const li = document.createElement('li');
                    li.className = "p-3 flex justify-between items-center hover:bg-white transition-colors";
                    li.innerHTML = `
                        <span class="font-medium text-gray-700 mr-2">📄 ${pdf}</span>
                        <div class="flex gap-2 shrink-0">
                            <a href="/api/pdfs/${pdf}" download="${pdf}" class="text-blue-500 hover:text-blue-700 hover:bg-blue-100 p-1 rounded transition-colors text-xl leading-none" title="Descargar">⬇️</a>
                            <button onclick="deletePdf('${pdf}')" class="text-red-500 hover:text-red-700 hover:bg-red-100 p-1 rounded transition-colors text-xl leading-none" title="Eliminar">✖</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                list.innerHTML = "<li class='p-3 text-red-500'>Error al cargar</li>";
            }
        }

        async function uploadPdfs() {
            const fileInput = document.getElementById('pdf-upload');
            const statusLabel = document.getElementById('upload-status');
            if(fileInput.files.length === 0) {
                statusLabel.innerText = "⚠️ Selecciona al menos un archivo";
                statusLabel.className = "mt-3 text-orange-500 text-sm font-medium h-5";
                setTimeout(() => statusLabel.innerText = "", 3000);
                return;
            }
            statusLabel.innerText = "⏳ Subiendo...";
            statusLabel.className = "mt-3 text-blue-500 text-sm font-medium h-5";
            const formData = new FormData();
            for(let i = 0; i < fileInput.files.length; i++) {
                formData.append("files", fileInput.files[i]);
            }
            try {
                await fetch('/api/pdfs', { method: 'POST', body: formData });
                statusLabel.innerText = "✅ Subida exitosa";
                statusLabel.className = "mt-3 text-green-600 text-sm font-medium h-5";
                fileInput.value = "";
                loadPdfs();
                setTimeout(() => statusLabel.innerText = "", 3000);
            } catch (err) {
                statusLabel.innerText = "❌ Error al subir";
                statusLabel.className = "mt-3 text-red-600 text-sm font-medium h-5";
                setTimeout(() => statusLabel.innerText = "", 3000);
            }
        }

        async function deletePdf(filename) {
            if(!confirm(`¿Seguro que deseas eliminar ${filename}?`)) return;
            try {
                await fetch(`/api/pdfs/${filename}`, { method: 'DELETE' });
                loadPdfs();
            } catch (err) {
                alert("Error al borrar el archivo");
            }
        }

        async function loadLogs() {
            const list = document.getElementById('log-list');
            try {
                const res = await fetch('/api/logs');
                const data = await res.json();
                list.innerHTML = "";
                if(data.logs.length === 0) { list.innerHTML = "<li class='p-2 text-gray-500 italic'>No hay logs</li>"; return; }
                data.logs.forEach(log => {
                    const li = document.createElement('li');
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left px-4 py-2 bg-gray-50 border border-gray-200 rounded hover:bg-blue-50 hover:border-blue-300 transition-colors text-sm text-gray-700 truncate";
                    btn.innerText = `📂 ${log}`;
                    btn.onclick = () => readLog(log);
                    li.appendChild(btn);
                    list.appendChild(li);
                });
            } catch (err) {
                list.innerHTML = "<li class='p-2 text-red-500'>Error al cargar logs</li>";
            }
        }

        async function readLog(filename) {
            document.getElementById('log-title').innerText = `📄 Viendo: ${filename}`;
            document.getElementById('log-viewer').value = "Cargando contenido...";
            try {
                const res = await fetch(`/api/logs/${filename}`);
                const data = await res.json();
                document.getElementById('log-viewer').value = data.contenido;
                const viewer = document.getElementById('log-viewer');
                viewer.scrollTop = viewer.scrollHeight;
            } catch (err) {
                document.getElementById('log-viewer').value = "❌ Error al leer el archivo.";
            }
        }
    </script>
</body>
</html>
