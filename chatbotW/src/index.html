<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuraDocs - Panel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Animaciones para el botón expandible */
        .scale-90 { transform: scale(0.9); }
        .scale-100 { transform: scale(1); }
        /* Transiciones suaves para el menú expandible */
        .menu-expand-enter { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .menu-expand-leave { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
    
    <!-- Scripts -->
    <script type="module" src="/static/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen" x-data x-cloak>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2">
        <template x-for="toast in $store.toasts.list" :key="toast.id">
            <div :class="{
                'bg-green-600': toast.type === 'success',
                'bg-red-600': toast.type === 'error',
                'bg-blue-600': toast.type === 'info'
            }" class="px-4 py-3 rounded-lg shadow-lg text-sm font-medium text-white transition-all duration-300 flex items-center gap-2">
                <span x-text="toast.type === 'success' ? '✅' : (toast.type === 'error' ? '❌' : 'ℹ️')"></span>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- LOGIN VIEW (loader mientras verify() corre; login si no hay token) -->
    <template x-if="!$store.auth.verified">
        <div class="min-h-screen flex items-center justify-center bg-gray-100">
            <div class="text-gray-500 font-medium">⏳ Verificando sesión…</div>
        </div>
    </template>
    <template x-if="$store.auth.verified && !$store.auth.token">
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-600 to-green-800">
            <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl p-8 w-full max-w-md border border-white/20">
                <div class="text-center mb-8">
                    <img src="/static/images/logo.jpeg" alt="NeuraDocs" class="h-20 w-auto mx-auto mb-4">
                    <h1 class="text-2xl font-bold text-gray-800">NeuraDocs</h1>
                    <p class="text-gray-500 text-sm mt-1">Panel Admin - Chatbot WhatsApp</p>
                </div>
                <form @submit.prevent="doLogin" x-data="loginForm">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                        <input type="text" x-model="username" placeholder="Ingresá tu usuario" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none transition-shadow">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input type="password" x-model="password" placeholder="••••••••" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none transition-shadow">
                    </div>
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg transition-colors disabled:opacity-50 shadow-md" x-text="loading ? 'Ingresando...' : 'Ingresar'" :disabled="loading"></button>
                    <p x-show="error" x-text="error" class="text-red-600 text-sm text-center mt-3 font-medium"></p>
                </form>
            </div>
        </div>
    </template>

    <!-- APP VIEW (solo se muestra si verified && token) -->
    <template x-if="$store.auth.verified && $store.auth.token">
        <div x-data="adminPanel">
            <!-- NAVBAR -->
            <nav class="bg-gradient-to-r from-blue-800 to-blue-600 text-white shadow-lg sticky top-0 z-40">
                <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img src="/static/images/logo.jpeg" alt="NeuraDocs" class="h-10 w-auto">
                        <div class="flex flex-col">
                            <span class="font-bold text-lg tracking-tight leading-tight">NeuraDocs</span>
                            <span class="text-xs text-blue-200 leading-tight">Panel Admin</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button @click="$store.app.botPhone && window.open('https://wa.me/' + $store.app.botPhone, '_blank')"
                                :class="$store.app.botPhone ? 'bg-green-600 hover:bg-green-500 cursor-pointer shadow-sm' : 'bg-green-800 opacity-50 cursor-not-allowed'"
                                :disabled="!$store.app.botPhone"
                                :title="$store.app.botPhone ? 'Abrir WhatsApp' : 'Instancia no conectada o sin número'"
                                class="px-4 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-1.5">
                            <span>📱</span>
                            <span x-text="$store.app.botPhone ? 'WhatsApp' : 'Sin configurar'"></span>
                        </button>
                        <button @click="$store.auth.logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm transition-colors shadow-sm">
                            Cerrar sesión
                        </button>
                    </div>
                </div>
            </nav>

            <!-- TAB BAR -->
            <div class="max-w-5xl mx-auto py-6 px-4">
                <div class="flex space-x-1 border-b border-gray-300 mb-6 overflow-x-auto items-end">
                    <button @click="switchTab('config')" :class="activeTab === 'config' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'" class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors whitespace-nowrap">🔑 Configuración</button>
                    <button @click="switchTab('docs')" :class="activeTab === 'docs' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'" class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors whitespace-nowrap">📁 Documentos</button>
                    <button @click="switchTab('faqs')" :class="activeTab === 'faqs' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'" class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors whitespace-nowrap">❓ FAQs</button>
                    <button @click="switchTab('instances')" :class="activeTab === 'instances' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'" class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors whitespace-nowrap">📡 Instancias</button>
                    <button @click="switchTab('logs')" :class="activeTab === 'logs' ? 'bg-white text-blue-600 border-b-2 border-blue-600 shadow-sm' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'" class="px-6 py-3 font-semibold rounded-t-lg focus:outline-none transition-colors whitespace-nowrap">📜 Logs</button>
                </div>

                <!-- ─── TAB: Configuración ─── -->
                <div x-show="activeTab === 'config'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800">Configuración de Google API Key</h2>
                    <div class="flex gap-4">
                        <input type="text" x-model="apiKey" placeholder="Pega tu clave aquí..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                        <button @click="saveApiKey()" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-sm">Guardar en .env</button>
                    </div>
                    <p x-text="apiStatus" :class="apiStatusClass" class="mt-3 font-medium text-sm h-5"></p>

                    <hr class="my-8 border-gray-100">

                    <h2 class="text-xl font-semibold mb-4 text-gray-800">☎️ Variables de Contacto (Bot)</h2>
                    <p class="text-sm text-gray-500 mb-6">Estos datos se inyectarán dinámicamente en las respuestas de la IA.</p>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Correo de Soporte</label>
                            <input type="email" x-model="configEmail" placeholder="soporte@tuempresa.com" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Teléfono de Contacto</label>
                            <div class="flex shadow-sm rounded-lg overflow-hidden border border-gray-300 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">
                                <select x-model="configPhoneCode" class="px-2 py-2 bg-gray-50 border-r border-gray-300 cursor-pointer max-w-[180px] outline-none">
                                    <option value="+54">(ARG) +54</option>
                                    <option value="+56">(CHL) +56</option>
                                    <option value="+57">(COL) +57</option>
                                    <option value="+52">(MEX) +52</option>
                                    <option value="+51">(PER) +51</option>
                                    <option value="+598">(URY) +598</option>
                                    <option value="+58">(VEN) +58</option>
                                    <option value="+591">(BOL) +591</option>
                                    <option value="+595">(PRY) +595</option>
                                    <option value="+593">(ECU) +593</option>
                                    <option value="+1">(USA) +1</option>
                                    <option value="+34">(ESP) +34</option>
                                </select>
                                <input type="text" x-model="configPhoneNum" placeholder="11 1234-5678" class="flex-1 px-4 py-2 outline-none">
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-3 mt-6">
                        <button @click="saveContactConfig()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-sm">Guardar Datos</button>
                    </div>
                    <p x-text="configStatus" :class="configStatusClass" class="mt-3 font-medium text-sm h-5"></p>
                </div>

                <!-- ─── TAB: Documentos ─── -->
                <div x-show="activeTab === 'docs'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                        <div>
                            <h2 class="text-xl font-semibold mb-4 text-gray-800 flex items-center min-h-[40px]">📤 Subir Nuevos (PDF)</h2>
                            <input type="file" multiple accept=".pdf" @change="uploadPdfs" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4 cursor-pointer border border-gray-200 rounded-lg p-2 transition-colors">
                            <p x-text="pdfUploadStatus" :class="pdfUploadStatusClass" class="mt-3 font-medium text-sm h-5"></p>
                        </div>
                        <div>
                            <h2 class="text-xl font-semibold mb-4 flex justify-between items-center min-h-[40px] text-gray-800">
                                <span>📥 Archivos en Servidor</span>
                                <button @click="loadPdfs()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-3 rounded-lg transition-colors border border-gray-200">🔄 Refrescar</button>
                            </h2>
                            <ul class="border border-gray-200 rounded-lg divide-y divide-gray-100 bg-gray-50 overflow-hidden shadow-inner max-h-[300px] overflow-y-auto custom-scrollbar">
                                <template x-if="pdfs.length === 0">
                                    <li class="p-4 text-gray-500 italic text-center text-sm">📁 Carpeta vacía</li>
                                </template>
                                <template x-for="pdf in pdfs" :key="pdf">
                                    <li class="p-3 flex justify-between items-center hover:bg-white transition-colors group border-b border-gray-100 last:border-b-0">
                                        <span class="font-medium text-gray-700 mr-2 flex items-center gap-2 min-w-0">📄 <span x-text="pdf" class="text-sm truncate"></span></span>
                                        <div class="flex gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button @click="downloadFile('/api/pdfs/' + pdf, pdf)" class="text-blue-500 hover:bg-blue-50 p-1.5 rounded-md transition-colors leading-none" title="Descargar">⬇️</button>
                                            <button @click="deletePdf(pdf)" class="text-red-500 hover:bg-red-50 p-1.5 rounded-md transition-colors leading-none" title="Eliminar">✖</button>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>

                    <hr class="my-8 border-gray-100">

                    <h2 class="text-xl font-semibold mb-4 text-gray-800">📊 Gestión de CSVs</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
                        <div>
                            <h3 class="text-lg font-semibold mb-3 text-gray-700 flex items-center min-h-[36px]">📤 Subir CSV</h3>
                            <input type="file" accept=".csv" @change="uploadCsvs" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 mb-4 cursor-pointer border border-gray-200 rounded-lg p-2 transition-colors">
                            <p x-text="csvUploadStatus" :class="csvUploadStatusClass" class="mt-3 font-medium text-sm h-5"></p>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold mb-3 flex justify-between items-center min-h-[36px] text-gray-700">
                                <span>📥 Archivos CSV</span>
                                <button @click="loadCsvs()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-3 rounded-lg transition-colors border border-gray-200">🔄 Refrescar</button>
                            </h3>
                            <ul class="border border-gray-200 rounded-lg divide-y divide-gray-100 bg-gray-50 overflow-hidden shadow-inner max-h-[300px] overflow-y-auto custom-scrollbar">
                                <template x-if="csvs.length === 0">
                                    <li class="p-4 text-gray-500 italic text-center text-sm">📁 Carpeta vacía</li>
                                </template>
                                <template x-for="csv in csvs" :key="csv">
                                    <li class="p-3 flex justify-between items-center hover:bg-white transition-colors group border-b border-gray-100 last:border-b-0">
                                        <span class="font-medium text-gray-700 mr-2 flex items-center gap-2 min-w-0">📊 <span x-text="csv" class="text-sm truncate max-w-[200px]"></span></span>
                                        <div class="flex gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <button @click="$store.csvEditor.edit(csv)" class="text-yellow-600 hover:bg-yellow-50 p-1.5 rounded-md transition-colors leading-none" title="Editar">✏️</button>
                                            <button @click="downloadFile('/api/csvs/' + csv, csv)" class="text-blue-500 hover:bg-blue-50 p-1.5 rounded-md transition-colors leading-none" title="Descargar">⬇️</button>
                                            <button @click="deleteCsv(csv)" class="text-red-500 hover:bg-red-50 p-1.5 rounded-md transition-colors leading-none" title="Eliminar">✖</button>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>

                    <!-- CSV Editor -->
                    <div x-show="$store.csvEditor.show" x-transition class="mt-8 border border-gray-200 rounded-xl p-6 bg-white shadow-sm">
                        <h3 class="text-lg font-semibold mb-4 text-gray-800" x-text="`✏️ Editando: ${$store.csvEditor.filename}`"></h3>

                        <div x-show="$store.csvEditor.loading" class="text-center py-8 text-gray-500">Cargando datos...</div>

                        <div x-show="!$store.csvEditor.loading">
                            <div class="overflow-auto max-h-[500px] mb-6 rounded-lg border border-gray-200 custom-scrollbar">
                                <table class="w-full border-collapse">
                                    <thead>
                                        <tr class="bg-gray-50 border-b border-gray-200">
                                            <th class="px-3 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-10">#</th>
                                            <template x-for="(header, idx) in $store.csvEditor.headers" :key="idx">
                                                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider border-l border-gray-200" x-text="header"></th>
                                            </template>
                                            <th class="px-3 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider border-l border-gray-200 w-12">🗑️</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-100">
                                        <template x-for="(row, rowIdx) in $store.csvEditor.rows" :key="rowIdx">
                                            <tr class="hover:bg-gray-50 transition-colors">
                                                <td class="px-3 py-2 text-center text-xs text-gray-400 font-medium" x-text="rowIdx + 1"></td>
                                                <template x-for="(cell, colIdx) in row" :key="colIdx">
                                                    <td class="p-1 border-l border-gray-100">
                                                        <input type="text" x-model="$store.csvEditor.rows[rowIdx][colIdx]" @input="$store.csvEditor.markDirty()" class="w-full border-0 bg-transparent px-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white rounded-md outline-none transition-shadow text-gray-700">
                                                    </td>
                                                </template>
                                                <td class="px-2 py-2 text-center border-l border-gray-100">
                                                    <button @click="$store.csvEditor.removeRow(rowIdx)" class="text-red-400 hover:text-red-600 hover:bg-red-50 p-1.5 rounded-md transition-colors" title="Eliminar fila">✖</button>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>

                            <div class="flex gap-3 flex-wrap items-center">
                                <button @click="$store.csvEditor.save()" :disabled="$store.csvEditor.saving" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors disabled:opacity-50 shadow-sm flex items-center gap-2">
                                    <span x-show="!$store.csvEditor.saving">💾 Guardar</span>
                                    <span x-show="$store.csvEditor.saving">⏳ Guardando...</span>
                                </button>
                                <button @click="$store.csvEditor.addRow()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg transition-colors shadow-sm">
                                    ➕ Fila
                                </button>
                                <button @click="$store.csvEditor.cancel()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-sm">
                                    ❌ Cancelar
                                </button>
                                <span x-show="$store.csvEditor.status" x-text="$store.csvEditor.status" class="ml-auto text-sm font-medium" :class="$store.csvEditor.statusClass"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ─── TAB: Logs ─── -->
                <div x-show="activeTab === 'logs'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 h-[500px] md:h-[600px]">
                        <div class="md:col-span-1 border-r border-gray-100 pr-6 flex flex-col h-full">
                            <h2 class="text-lg font-semibold mb-4 flex justify-between items-center text-gray-800">
                                <span>📋 Registros</span>
                                <button @click="loadLogs()" class="text-xs bg-gray-100 hover:bg-gray-200 py-1.5 px-2.5 rounded-lg transition-colors border border-gray-200">🔄</button>
                            </h2>
                            <div class="relative mb-4">
                                <input type="text" x-model="searchQuery" @input.debounce.300ms="performSearch" placeholder="Buscar por nombre..." class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-shadow">
                                <span class="absolute left-3 top-2 text-gray-400">🔍</span>
                            </div>
                            <ul class="space-y-2 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                <template x-if="displayLogs.length === 0">
                                    <li class="text-gray-400 italic text-sm text-center mt-4">Sin resultados</li>
                                </template>
                                <template x-for="log in displayLogs" :key="log.filename">
                                    <li>
                                        <button @click="readLog(log.filename)" class="w-full text-left px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-lg hover:bg-blue-50 hover:border-blue-300 hover:shadow-sm transition-all text-sm text-gray-700 truncate group">
                                            <span class="group-hover:translate-x-1 inline-block transition-transform duration-200">📂 <span x-text="log.filename"></span></span>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                        </div>
                        <div class="md:col-span-2 flex flex-col h-full pl-2 min-h-0">
                            <h2 x-text="currentLogTitle" class="text-lg font-semibold mb-4 text-gray-800"></h2>

                            <div class="w-full flex-1 min-h-0 bg-wpp p-4 rounded-xl overflow-y-auto flex flex-col gap-3 shadow-inner border border-gray-200 custom-scrollbar relative">
                                <div x-show="loadingLog" class="absolute inset-0 bg-white/50 backdrop-blur-sm flex items-center justify-center z-10 rounded-xl">
                                    <div class="text-gray-500 font-medium">Cargando...</div>
                                </div>
                                <div x-show="!loadingLog && !currentLogContent" class="text-center text-gray-500 text-sm mt-auto mb-auto">
                                    Selecciona un log a la izquierda para visualizar la conversación.
                                </div>
                                <div x-html="currentLogContent" class="flex flex-col gap-3 w-full pb-4"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ─── TAB: FAQs ─── -->
                <div x-show="activeTab === 'faqs'" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold text-gray-800">❓ Respuestas Frecuentes</h2>
                        <div class="flex gap-2">
                            <button @click="loadFaqs()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-3 rounded-lg transition-colors border border-gray-200">🔄 Refrescar</button>
                            <button @click="startCreateFaq()" class="text-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold py-1.5 px-3 rounded-lg transition-colors shadow-sm">➕ Agregar fila</button>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 mb-4">Estas respuestas se devuelven directo al usuario sin pasar por la IA (match por similitud). Editá o eliminá las filas según necesites.</p>

                    <!-- Form de creación / edición -->
                    <div x-show="faqForm.open" x-transition class="mb-6 border border-gray-200 rounded-xl p-5 bg-gray-50 shadow-sm">
                        <h3 class="text-lg font-semibold mb-4 text-gray-800" x-text="faqForm.editId ? '✏️ Editar FAQ' : '➕ Nueva FAQ'"></h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Pregunta <span class="text-gray-400 font-normal">(máx 500)</span></label>
                                <textarea x-model="faqForm.pregunta" maxlength="500" rows="2" placeholder="Ej: ¿Cuál es el horario de atención?" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow resize-y"></textarea>
                                <p class="text-xs text-right mt-1" :class="faqForm.pregunta.length > 500 ? 'text-red-600' : 'text-gray-400'" x-text="`${faqForm.pregunta.length} / 500`"></p>
                                <p x-show="faqForm.errors.pregunta" x-text="faqForm.errors.pregunta" class="text-xs text-red-600 mt-1 font-medium"></p>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Respuesta <span class="text-gray-400 font-normal">(máx 500)</span></label>
                                <textarea x-model="faqForm.respuesta" maxlength="500" rows="3" placeholder="Ej: Lun a Vie de 9 a 18hs." class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow resize-y"></textarea>
                                <p class="text-xs text-right mt-1" :class="faqForm.respuesta.length > 500 ? 'text-red-600' : 'text-gray-400'" x-text="`${faqForm.respuesta.length} / 500`"></p>
                                <p x-show="faqForm.errors.respuesta" x-text="faqForm.errors.respuesta" class="text-xs text-red-600 mt-1 font-medium"></p>
                            </div>
                        </div>
                        <div class="flex gap-3 mt-4">
                            <button @click="saveFaq()" :disabled="!faqForm.valid || faqForm.saving" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm flex items-center gap-2">
                                <span x-show="!faqForm.saving">💾 Guardar</span>
                                <span x-show="faqForm.saving">⏳ Guardando...</span>
                            </button>
                            <button @click="cancelFaqForm()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-sm">❌ Cancelar</button>
                        </div>
                    </div>

                    <!-- Tabla de FAQs -->
                    <div class="overflow-auto max-h-[500px] custom-scrollbar rounded-lg border border-gray-200">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200">
                                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-1/3">Pregunta</th>
                                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-1/2">Respuesta</th>
                                    <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-100">
                                <template x-if="faqs.length === 0">
                                    <tr>
                                        <td colspan="3" class="p-8 text-center text-gray-500 italic text-sm">📭 Aún no hay FAQs. Hacé clic en "Agregar fila" para crear la primera.</td>
                                    </tr>
                                </template>
                                <template x-for="faq in faqs" :key="faq.id">
                                    <tr class="hover:bg-gray-50 transition-colors">
                                        <td class="px-4 py-3 text-sm text-gray-800 align-top"><div class="whitespace-pre-wrap break-words" x-text="faq.pregunta"></div></td>
                                        <td class="px-4 py-3 text-sm text-gray-700 align-top"><div class="whitespace-pre-wrap break-words" x-text="faq.respuesta"></div></td>
                                        <td class="px-4 py-3 text-center align-top">
                                            <div class="flex gap-1 justify-center">
                                                <button @click="startEditFaq(faq)" class="text-yellow-600 hover:bg-yellow-50 p-1.5 rounded-md transition-colors" title="Editar">✏️</button>
                                                <button @click="confirmDeleteFaq(faq)" class="text-red-500 hover:bg-red-50 p-1.5 rounded-md transition-colors" title="Eliminar">🗑️</button>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- ─── TAB: Instancias (Evolution) ─── -->
                <div x-show="activeTab === 'instances'" x-data="instancesPanel" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold text-gray-800">📡 Instancias de WhatsApp (Evolution)</h2>
                        <button @click="loadInstances()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 py-1.5 px-3 rounded-lg transition-colors border border-gray-200">🔄 Refrescar</button>
                    </div>
                    <p class="text-sm text-gray-500 mb-4">Administrá las instancias de Evolution API. La activa es la que recibe los mensajes entrantes (el bot hace hot-swap sin reiniciar).</p>

                    <!-- Crear instancia -->
                    <div class="mb-6 border border-gray-200 rounded-xl p-5 bg-gray-50 shadow-sm">
                        <h3 class="text-lg font-semibold mb-3 text-gray-800">➕ Crear nueva instancia</h3>
                        <form @submit.prevent="createInstance()" class="flex flex-col sm:flex-row gap-3 sm:items-center">
                            <div class="flex-1">
                                <label class="block text-sm font-semibold text-gray-700 mb-1" for="new-instance-name">Nombre</label>
                                <input id="new-instance-name" type="text" x-model="createForm.name" placeholder="ej. bot_2" pattern="[A-Za-z0-9_-]+" maxlength="64" aria-describedby="new-instance-name-help" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" required>
                            </div>
                            <button type="submit" :disabled="createForm.saving" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors disabled:opacity-50 shadow-sm">
                                <span x-show="!createForm.saving">Crear</span>
                                <span x-show="createForm.saving">⏳ Creando...</span>
                            </button>
                            <p id="new-instance-name-help" class="text-xs text-gray-400 sm:hidden">Solo letras, números, guión bajo y guión medio. Máx 64 caracteres.</p>
                        </form>
                        <p class="text-xs text-gray-400 mt-1 hidden sm:block">Solo letras, números, guión bajo y guión medio. Máx 64 caracteres.</p>
                        <p x-show="createForm.error" x-text="createForm.error" class="text-xs text-red-600 mt-2 font-medium"></p>
                    </div>

                    <!-- Lista de instancias -->
                    <div class="overflow-auto max-h-[800px] custom-scrollbar rounded-lg border border-gray-200">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200">
                                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Nombre</th>
                                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Owner</th>
                                    <th class="hidden md:table-cell px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Link</th>
                                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Estado</th>
                                    <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-100">
                                <template x-if="loading">
                                    <tr><td colspan="5" class="p-6 text-center text-gray-500 text-sm">⏳ Cargando instancias...</td></tr>
                                </template>
                                <template x-if="!loading && instances.length === 0">
                                    <tr><td colspan="5" class="p-8 text-center text-gray-500 italic text-sm">📭 No hay instancias registradas. Creá la primera con el formulario de arriba.</td></tr>
                                </template>
                                <template x-for="inst in instances" :key="inst.name">
                                    <tr class="hover:bg-gray-50 transition-colors">
                                        <td class="px-4 py-3 text-sm font-medium text-gray-800" x-text="inst.name"></td>
                                        <td class="px-4 py-3 text-xs text-gray-600 font-mono" x-text="inst.ownerJid || '—'"></td>
                                        <td class="hidden md:table-cell px-4 py-3 text-center">
                                            <button @click="copyWaLink(inst)"
                                                    :disabled="!inst.ownerJid"
                                                    class="p-1.5 rounded hover:bg-gray-200 text-gray-600 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
                                                    title="Copiar link de WhatsApp">
                                                <i class="fas fa-copy"></i>
                                            </button>
                                        </td>
                                        <td class="px-4 py-3 text-sm">
                                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                                                  :class="{
                                                      'bg-green-100 text-green-800': inst.connectionState === 'open',
                                                      'bg-yellow-100 text-yellow-800': inst.connectionState === 'connecting',
                                                      'bg-gray-100 text-gray-700': inst.connectionState === 'close',
                                                      'bg-red-100 text-red-700': inst.connectionState === 'unknown'
                                                  }"
                                                  x-text="inst.connectionState"></span>
                                        </td>
                                        <td class="px-4 py-3 text-center">
                                            <div class="inline-flex items-center relative">
                                                <!-- Botón kebab / placeholder para mantener alto de fila -->
                                                <button data-kebab-menu
                                                        @click="toggleMenu(inst.name)"
                                                        x-show="!isMenuOpen(inst.name)"
                                                        class="p-1.5 rounded hover:bg-gray-700 text-gray-600 hover:text-white transition-all duration-200 ease-out">
                                                    <i class="fas fa-ellipsis-v"></i>
                                                </button>
                                                <div data-kebab-menu
                                                     x-show="isMenuOpen(inst.name)"
                                                     class="p-1.5 w-[30px] h-[30px]"></div>
                                                <!-- Acciones expandidas — centrado sobre el kebab -->
                                                <div data-kebab-menu x-show="isMenuOpen(inst.name)"
                                                     x-transition:enter="menu-expand-enter"
                                                     x-transition:enter-start="opacity-0 scale-95"
                                                     x-transition:enter-end="opacity-100 scale-100"
                                                     x-transition:leave="menu-expand-leave"
                                                     x-transition:leave-start="opacity-100 scale-100"
                                                     x-transition:leave-end="opacity-0 scale-95"
                                                     @keydown.escape.window="closeAllMenus()"
                                                     class="absolute left-1/2 -translate-x-1/2 z-10 inline-flex items-center gap-1 px-2 py-1 rounded-lg shadow-lg bg-gradient-to-br from-gray-200 to-gray-300 border border-gray-300/60">
                                                    <button @click="closeAllMenus(); openQrModal(inst)"
                                                            :disabled="inst.connectionState === 'open'"
                                                            class="p-1.5 rounded hover:bg-white/50 text-gray-700 hover:text-gray-900 transition-all duration-150 disabled:opacity-30 disabled:cursor-not-allowed"
                                                            title="Ver QR">
                                                        <i class="fas fa-link"></i>
                                                    </button>
                                                    <button @click="closeAllMenus(); openSwapModal(inst)"
                                                            :disabled="inst.connectionState !== 'open' || isActive(inst)"
                                                            class="p-1.5 rounded hover:bg-white/50 text-gray-700 hover:text-gray-900 transition-all duration-150 disabled:opacity-30 disabled:cursor-not-allowed"
                                                            title="Activar">
                                                        <i class="fas fa-power-off"></i>
                                                    </button>
                                                    <button @click="closeAllMenus(); deactivateInstance(inst)"
                                                            :disabled="!isActive(inst)"
                                                            class="p-1.5 rounded hover:bg-white/50 text-gray-700 hover:text-gray-900 transition-all duration-150 disabled:opacity-30 disabled:cursor-not-allowed"
                                                            title="Desactivar">
                                                        <i class="fas fa-ban"></i>
                                                    </button>
                                                    <button @click="closeAllMenus(); deleteInstance(inst)"
                                                            :disabled="isActive(inst)"
                                                            class="p-1.5 rounded hover:bg-white/50 text-red-500 hover:text-red-700 transition-all duration-150 disabled:opacity-30 disabled:cursor-not-allowed"
                                                            title="Eliminar">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <!-- ─── Modal: QR ─── -->
                    <dialog x-ref="qrDialog" @keydown="onModalKeydown" @keydown.tab="trapTabKey($event)" class="rounded-2xl shadow-2xl p-0 max-w-md w-full backdrop:bg-black/50">
                        <div class="p-6">
                            <h3 class="text-lg font-semibold text-gray-800 mb-2">📱 Escanear QR</h3>
                            <p class="text-sm text-gray-500 mb-4">Abrí WhatsApp en tu teléfono → Dispositivos vinculados → Vincular dispositivo.</p>
                            <div class="bg-gray-50 rounded-xl p-4 flex items-center justify-center min-h-[260px] border border-gray-200">
                                <template x-if="selected && _qrPayload && _qrPayload.qr">
                                    <img :src="_qrPayload.qr" :alt="'QR de ' + (selected && selected.name)" class="max-w-full max-h-72">
                                </template>
                                <template x-if="!selected || !_qrPayload || !_qrPayload.qr">
                                    <div class="text-center text-gray-400 text-sm">Sin QR disponible</div>
                                </template>
                            </div>
                            <p class="text-xs text-gray-500 mt-3">El QR se refresca automáticamente. Cerrá esta ventana una vez vinculado.</p>
                            <p class="text-xs text-gray-500 mt-1">Estado actual: <span class="font-mono font-semibold" x-text="selected && selected.connectionState"></span></p>
                            <div class="flex justify-end gap-2 mt-5">
                                <button @click="closeQrModal()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-5 rounded-lg transition-colors shadow-sm">Cerrar</button>
                            </div>
                        </div>
                    </dialog>

                    <!-- ─── Modal: Activar (Swap) ─── -->
                    <div x-show="showSwap" x-cloak
                         role="dialog" aria-modal="true" aria-labelledby="swap-title"
                         @keydown.escape="closeSwapModal()" @keydown.tab="trapTabKey($event)"
                         class="fixed inset-0 z-50 flex items-center justify-center p-4">
                        <div class="absolute inset-0 bg-black/50" aria-hidden="true"></div>
                        <div class="relative bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
                            <h3 id="swap-title" class="text-lg font-semibold text-gray-800 mb-2">⚡ Activar instancia</h3>
                            <p class="text-sm text-gray-500 mb-4">Vas a activar la instancia <span class="font-mono font-semibold" x-text="swapTarget && swapTarget.name"></span>. El bot empezará a usarla para los mensajes salientes (hot-swap, sin reiniciar).</p>

                            <label class="flex items-start gap-3 p-3 bg-yellow-50 border border-yellow-200 rounded-lg cursor-pointer mb-4">
                                <input type="checkbox" x-model="acknowledge" id="ack-swap" class="mt-1 h-4 w-4 text-blue-600 focus:ring-2 focus:ring-blue-500 border-gray-300 rounded">
                                <span class="text-sm text-gray-800 select-none">Entiendo que los usuarios que estén chateando ahora perderán el contexto de la conversación en vivo (su historial en disco se mantiene).</span>
                            </label>

                            <p x-show="swapTarget && swapTarget.connectionState !== 'open'" class="text-xs text-orange-700 bg-orange-50 border border-orange-200 rounded-lg p-2 mb-3">
                                ⚠️ La instancia debe estar en estado <span class="font-mono">open</span> (vinculada) para activarse. Estado actual: <span class="font-mono font-semibold" x-text="swapTarget && swapTarget.connectionState"></span>.
                            </p>

                            <p x-show="swapError" x-text="swapError" class="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg p-2 mb-3 font-medium"></p>

                            <div class="flex justify-end gap-2 mt-5">
                                <button @click="closeSwapModal()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-5 rounded-lg transition-colors shadow-sm">Cancelar</button>
                                <button @click="confirmSwap()" :disabled="!canActivate" :aria-disabled="!canActivate" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-5 rounded-lg transition-colors shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
                                    Activar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    </style>
</body>
</html>
