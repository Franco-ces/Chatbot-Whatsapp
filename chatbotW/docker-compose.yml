services:
  whatsapp-bot:
    build: .
    container_name: gemini_whatsapp_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./PDFs:/app/PDFs
      - ./audios:/app/audios
      - ./vectorstore:/app/vectorstore
      - ./cache:/app/cache
      - ./src:/app/src
    stdin_open: true
    tty: true

  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=franquitoGoat
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances: