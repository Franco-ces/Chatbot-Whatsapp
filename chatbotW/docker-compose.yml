services:
  whatsapp-bot:
    build: .
    container_name: gemini_whatsapp_bot
    hostname: bot.local
    restart: unless-stopped
    working_dir: /app/src
    command: uvicorn main:app --host 0.0.0.0 --port ${BOT_PORT:-5000} --reload
    ports:
      - "${BOT_PORT:-5000}:${BOT_PORT:-5000}"
    env_file:
      - .env
    environment: &bot-env
      # Ambos servicios DEBEN compartir estos paths para que
      # faq_paths.py y ConfigManager resuelvan las mismas rutas.
      FAQS_VOLUME_MOUNT: /app/faqs_data
      CONFIG_BOT_PATH: /app/config_data/config_bot.json
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: evolution_postgres
      EVO_API_KEY: ${EVO_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    volumes:
      - ./src:/app/src
      - ./PDFs:/app/PDFs
      - ./CSVs:/app/CSVs
      - ./audios:/app/audios
      - ./vectorstore:/app/vectorstore
      - ./cache:/app/cache
      - ./logs:/app/logs
      - config_data:/app/config_data
      - faq_data:/app/faqs_data
    networks:
      - backend
    depends_on:
      evolution_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  admin-ui:
    build: .
    container_name: admin_ui
    restart: unless-stopped
    working_dir: /app/src
    command: sh -c "pip install weasyprint --quiet 2>/dev/null && uvicorn interface:app --host 0.0.0.0 --port ${ADMIN_PORT:-8000} --reload"
    ports:
      - "${ADMIN_PORT:-8000}:${ADMIN_PORT:-8000}"
    env_file:
      - .env
    environment:
      <<: *bot-env
      # FAQS_VOLUME_MOUNT declarado explícito (además del heredado via *bot-env)
      # para que el contrato "todo servicio que monta faq_data setea la env var
      # al mismo directorio" sea visible por inspección estática del compose y
      # no dependa de resolver el anchor merge de YAML.
      FAQS_VOLUME_MOUNT: /app/faqs_data
      EVO_API_KEY: ${EVO_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      BOT_INTERNAL_URL: http://whatsapp-bot:5000
    volumes:
      - ./src:/app/src
      - ./PDFs:/app/PDFs
      - ./CSVs:/app/CSVs
      - ./logs:/app/logs
      - config_data:/app/config_data
      - faq_data:/app/faqs_data
      # Bind-mount de .env para que _write_env() pueda persistir
      # la API key y otros secrets. Ya no causa "Device or resource
      # busy" porque usamos escritura directa en vez de os.replace().
      - ./.env:/app/.env
    networks:
      - backend
    depends_on:
      evolution_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "${EVO_PORT:-8080}:${EVO_PORT:-8080}"
    depends_on:
      evolution_postgres:
        condition: service_healthy
      evolution_redis:
        condition: service_healthy
    environment:
      SERVER_URL: http://localhost:${EVO_PORT:-8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVO_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@evolution_postgres:5432/${POSTGRES_DB}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution_redis:6379/0
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G

  evolution_postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - evolution_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M

  evolution_redis:
    image: redis:alpine
    container_name: evolution_redis
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  evolution_instances:
  evolution_db:
  evolution_redis_data:
  faq_data:
  config_data:

networks:
  backend:
    driver: bridge
